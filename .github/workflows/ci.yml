name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    # Windows only. Every file carries `//go:build windows && amd64`, so a
    # Linux runner would compile nothing and pass without checking anything.
    runs-on: windows-latest
    steps:
      # SHA-pinned, and with the checkout token dropped after use, matching
      # every other workflow here. This one had drifted to floating tags, which
      # zizmor flags as unpinned-uses and artipacked (a persisted credential can
      # leave the runner inside an uploaded artifact).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # Vet everything hand-written. The generated packages are excluded because
      # the delegate adapters convert a raw uintptr to a typed pointer, which
      # trips vet's unsafe.Pointer heuristic by design: that word IS a native
      # object pointer the event source owns, arriving through a COM callback,
      # and there is no Go pointer for it to have come from.
      - name: Vet (non-generated packages)
        run: go vet ./cmd/... ./internal/... ./bindings/runtime/...

      # super-linter cannot check formatting here: it runs on Linux, where the
      # build tags exclude every file. So it is checked on Windows instead.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      # arm64 is deliberately excluded rather than generated for: Go's
      # asm_windows_arm64.s never loads the V registers, so floats and
      # all-float structs crossing syscall.SyscallN would be silently
      # corrupted. Assert the constraint holds, because a wildcard
      # `GOARCH=arm64 go build` would pass by building nothing at all.
      #
      # Placed before the tests so a static check is never skipped by a
      # runtime failure downstream of it.
      - name: Assert amd64-only build constraints
        shell: bash
        run: |
          if git grep -lE 'go:build.*(arm64|386)' -- '*.go'; then
            echo "::error::a file claims an architecture this module excludes"
            exit 1
          fi

      # The bootstrap path needs two things the repository cannot carry, and
      # they fail differently, so both are set up explicitly.
      #
      # First the bootstrapper itself: a Microsoft binary that ships only in the
      # NuGet package, for redistribution beside the executable. .gitignore
      # excludes it on purpose, so the runner fetches it.
      - name: Fetch the Windows App SDK bootstrapper
        run: go run ./cmd/generate fetch-bootstrap

      # Then the framework package it looks for. A bare runner has no Windows
      # App SDK runtime installed, so MddBootstrapInitialize2 returns
      # 0x80670016 ("package dependency criteria could not be resolved") — the
      # call is fine, the machine is simply missing the dependency. Installing
      # it is what makes the bootstrap tests test anything.
      - name: Install the Windows App SDK 2.3 runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/2.3/latest/windowsappruntimeinstall-x64.exe' -OutFile $installer
          & $installer --quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Error "WindowsAppRuntimeInstall exited $LASTEXITCODE"
            exit 1
          }
          Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.*' |
            Select-Object Name, Version | Format-Table -AutoSize

      # These make real WinRT calls. They are what proves this module composes
      # with the pinned go-bindings-winrt and go-bindings-win32 at runtime and
      # not merely at compile time.
      #
      # The acceptance tests go further: they put a real WinUI 3 window on screen
      # and let the framework call back into Go. A timeout is set explicitly
      # because Application.Start runs a message loop, and a startup that fails to
      # arrange its own shutdown would otherwise hang rather than fail.
      - name: Tests
        run: go test -timeout 5m ./...

  regen:
    name: Regeneration determinism gate
    # The generator itself is platform-independent, but it reads the committed
    # winmds and the pinned module's metadata, so it runs where everything else
    # does rather than introducing a second environment to reason about.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The Windows.* type universe is read out of the pinned go-bindings-winrt
      # module's own committed metadata, so it has to be in the module cache.
      - name: Download modules
        run: go mod download

      - name: Ingest the committed winmds
        run: go run ./cmd/generate ingest

      # --external makes an unresolvable Windows.* reference a hard error. It
      # would otherwise surface later as a compile failure with no indication of
      # which reference caused it.
      - name: Validate the metadata
        run: go run ./cmd/generate validate --external

      # Runs every type reference through the typemap. It fails on an import
      # alias collision, which is the failure that would otherwise appear as a
      # compile error across dozens of packages naming neither the alias nor the
      # namespaces that collided.
      - name: Resolve every reference
        run: go run ./cmd/generate resolve

      # One command clears and re-emits the committed bindings tree — the closure
      # of the roots pinned in metadata/emit-roots.txt — and enforces the
      # diagnostics ratchet: a projection this size always has members it cannot
      # represent, so the useful question is whether there are MORE than last
      # time.
      - name: Regenerate the bindings, with the ratchet
        run: go run ./cmd/generate bindings --diagnostics-baseline metadata/diagnostics-baseline.json

      # The point of committing both trees: regenerating must reproduce them byte
      # for byte, so a metadata change is always a reviewable diff and never a
      # surprise inside generated Go.
      - name: Generated output must match the committed tree
        shell: bash
        run: |
          git add -N bindings metadata/wasdk
          git diff --exit-code --stat -- bindings metadata/wasdk
